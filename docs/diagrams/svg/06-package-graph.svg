  <text class="foot" x="40" y="822">Derived from: the workspace dependency lists in each package.json (packages/*/package.json, apps/gateway-server/package.json). CLAUDE.md&#x27;s dependency graph writes these as @sint/* — the published scope in the manifests is @pshkv/*.</text>

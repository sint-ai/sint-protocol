  <text class="h1" x="40" y="48">SINT Protocol — package layering</text>
  <text class="sub" x="40" y="71">Published under the @pshkv scope. The gate-* packages live in directories without the prefix — packages/policy-gateway builds @pshkv/gate-policy-gateway.</text>
